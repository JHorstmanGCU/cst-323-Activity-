<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle} + ' | Course Log'">Teacher | Course Log</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Course Log</a>
			<div class="navbar-nav">
				<a class="nav-link" th:href="@{/students}">Students</a>
				<a class="nav-link active" th:href="@{/teachers}">Teachers</a>
				<a class="nav-link" th:href="@{/courses}">Courses</a>
				<a class="nav-link" th:href="@{/grades}">Grades</a>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div class="mb-3">
			<h1 class="h3 mb-1" th:text="${pageTitle}">Add Teacher</h1>
			<p class="text-muted mb-0">Enter the teacher information below.</p>
		</div>

		<form class="card shadow-sm" method="post" th:action="@{/teachers}" th:object="${teacher}">
			<input type="hidden" th:field="*{id}">

			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label" for="firstName">First Name</label>
						<input class="form-control" id="firstName" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" th:field="*{firstName}" type="text">
						<div class="invalid-feedback" th:errors="*{firstName}"></div>
					</div>

					<div class="col-md-6">
						<label class="form-label" for="lastName">Last Name</label>
						<input class="form-control" id="lastName" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" th:field="*{lastName}" type="text">
						<div class="invalid-feedback" th:errors="*{lastName}"></div>
					</div>

					<div class="col-md-8">
						<label class="form-label" for="email">Email</label>
						<input class="form-control" id="email" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" th:field="*{email}" type="email">
						<div class="invalid-feedback" th:errors="*{email}"></div>
					</div>

					<div class="col-md-4">
						<label class="form-label" for="department">Department</label>
						<input class="form-control" id="department" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'" th:field="*{department}" type="text">
						<div class="invalid-feedback" th:errors="*{department}"></div>
					</div>
				</div>
			</div>

			<div class="card-footer d-flex justify-content-end gap-2">
				<a class="btn btn-outline-secondary" th:href="@{/teachers}">Cancel</a>
				<button class="btn btn-primary" type="submit">Save Teacher</button>
			</div>
		</form>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
