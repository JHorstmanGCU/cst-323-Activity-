<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Teachers | Course Log</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Course Log</a>
			<div class="navbar-nav">
				<a class="nav-link" th:href="@{/students}">Students</a>
				<a class="nav-link active" th:href="@{/teachers}">Teachers</a>
				<a class="nav-link" th:href="@{/courses}">Courses</a>
				<a class="nav-link" th:href="@{/grades}">Grades</a>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<div>
				<h1 class="h3 mb-1">Teachers</h1>
				<p class="text-muted mb-0">Manage teacher records for the grade tracker.</p>
			</div>
			<a class="btn btn-primary" th:href="@{/teachers/new}">Add Teacher</a>
		</div>

		<div class="alert alert-success" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>
		<div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

		<div class="card shadow-sm">
			<div class="card-body">
				<table class="table table-striped table-hover align-middle mb-0">
					<thead>
						<tr>
							<th scope="col">First Name</th>
							<th scope="col">Last Name</th>
							<th scope="col">Email</th>
							<th scope="col">Department</th>
							<th scope="col" class="text-end">Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(teachers)}">
							<td colspan="5" class="text-center text-muted py-4">No teachers have been added yet.</td>
						</tr>
						<tr th:each="teacher : ${teachers}">
							<td th:text="${teacher.firstName}">Jane</td>
							<td th:text="${teacher.lastName}">Doe</td>
							<td th:text="${teacher.email}">jane@example.com</td>
							<td th:text="${teacher.department}">Math</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-primary" th:href="@{/teachers/{id}/edit(id=${teacher.id})}">Edit</a>
								<form class="d-inline" method="post" th:action="@{/teachers/{id}/delete(id=${teacher.id})}">
									<button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
