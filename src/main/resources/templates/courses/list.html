<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Courses | Course Log</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Course Log</a>
			<div class="navbar-nav">
				<a class="nav-link" th:href="@{/students}">Students</a>
				<a class="nav-link" th:href="@{/teachers}">Teachers</a>
				<a class="nav-link active" th:href="@{/courses}">Courses</a>
				<a class="nav-link" th:href="@{/grades}">Grades</a>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<div>
				<h1 class="h3 mb-1">Courses</h1>
				<p class="text-muted mb-0">Manage course records and assigned teachers.</p>
			</div>
			<a class="btn btn-primary" th:href="@{/courses/new}">Add Course</a>
		</div>

		<div class="alert alert-success" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>
		<div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

		<div class="card shadow-sm">
			<div class="card-body">
				<table class="table table-striped table-hover align-middle mb-0">
					<thead>
						<tr>
							<th scope="col">Code</th>
							<th scope="col">Course</th>
							<th scope="col">Credits</th>
							<th scope="col">Teacher</th>
							<th scope="col" class="text-end">Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(courses)}">
							<td colspan="5" class="text-center text-muted py-4">No courses have been added yet.</td>
						</tr>
						<tr th:each="course : ${courses}">
							<td th:text="${course.courseCode}">CST-323</td>
							<td>
								<div class="fw-semibold" th:text="${course.courseName}">Cloud Computing</div>
								<div class="small text-muted" th:text="${course.description}">Course description</div>
							</td>
							<td th:text="${course.creditHours}">3</td>
							<td th:text="${course.teacher != null ? course.teacher.firstName + ' ' + course.teacher.lastName : 'Unassigned'}">Jane Doe</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-primary" th:href="@{/courses/{id}/edit(id=${course.id})}">Edit</a>
								<form class="d-inline" method="post" th:action="@{/courses/{id}/delete(id=${course.id})}">
									<button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
