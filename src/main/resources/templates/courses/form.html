<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle} + ' | Course Log'">Course | Course Log</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Course Log</a>
			<div class="navbar-nav">
				<a class="nav-link" th:href="@{/students}">Students</a>
				<a class="nav-link" th:href="@{/teachers}">Teachers</a>
				<a class="nav-link active" th:href="@{/courses}">Courses</a>
				<a class="nav-link" th:href="@{/grades}">Grades</a>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div class="mb-3">
			<h1 class="h3 mb-1" th:text="${pageTitle}">Add Course</h1>
			<p class="text-muted mb-0">Enter the course information below.</p>
		</div>

		<form class="card shadow-sm" method="post" th:action="@{/courses}" th:object="${course}">
			<input type="hidden" th:field="*{id}">

			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-4">
						<label class="form-label" for="courseCode">Course Code</label>
						<input class="form-control" id="courseCode" th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid'" th:field="*{courseCode}" type="text">
						<div class="invalid-feedback" th:errors="*{courseCode}"></div>
					</div>

					<div class="col-md-8">
						<label class="form-label" for="courseName">Course Name</label>
						<input class="form-control" id="courseName" th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid'" th:field="*{courseName}" type="text">
						<div class="invalid-feedback" th:errors="*{courseName}"></div>
					</div>

					<div class="col-md-8">
						<label class="form-label" for="description">Description</label>
						<input class="form-control" id="description" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" th:field="*{description}" type="text">
						<div class="invalid-feedback" th:errors="*{description}"></div>
					</div>

					<div class="col-md-4">
						<label class="form-label" for="creditHours">Credit Hours</label>
						<input class="form-control" id="creditHours" min="1" th:classappend="${#fields.hasErrors('creditHours')} ? 'is-invalid'" th:field="*{creditHours}" type="number">
						<div class="invalid-feedback" th:errors="*{creditHours}"></div>
					</div>

					<div class="col-md-6">
						<label class="form-label" for="teacherId">Teacher</label>
						<select class="form-select" id="teacherId" name="teacherId">
							<option value="">No teacher selected</option>
							<option th:each="teacher : ${teachers}"
									th:selected="${course.teacher != null and course.teacher.id == teacher.id}"
									th:text="${teacher.firstName + ' ' + teacher.lastName}"
									th:value="${teacher.id}">Jane Doe</option>
						</select>
					</div>
				</div>
			</div>

			<div class="card-footer d-flex justify-content-end gap-2">
				<a class="btn btn-outline-secondary" th:href="@{/courses}">Cancel</a>
				<button class="btn btn-primary" type="submit">Save Course</button>
			</div>
		</form>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
