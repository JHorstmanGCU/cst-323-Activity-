<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle} + ' | Course Log'">Grade | Course Log</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Course Log</a>
			<div class="navbar-nav">
				<a class="nav-link" th:href="@{/students}">Students</a>
				<a class="nav-link" th:href="@{/teachers}">Teachers</a>
				<a class="nav-link" th:href="@{/courses}">Courses</a>
				<a class="nav-link active" th:href="@{/grades}">Grades</a>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div class="mb-3">
			<h1 class="h3 mb-1" th:text="${pageTitle}">Add Grade</h1>
			<p class="text-muted mb-0">Enter the overall course grade below.</p>
		</div>

		<div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

		<form class="card shadow-sm" method="post" th:action="@{/grades}" th:object="${grade}">
			<input type="hidden" th:field="*{id}">

			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label" for="studentId">Student</label>
						<select class="form-select" id="studentId" name="studentId" required>
							<option value="">Select a student</option>
							<option th:each="student : ${students}"
									th:selected="${grade.student != null and grade.student.id == student.id}"
									th:text="${student.firstName + ' ' + student.lastName}"
									th:value="${student.id}">Jane Doe</option>
						</select>
					</div>

					<div class="col-md-6">
						<label class="form-label" for="courseId">Course</label>
						<select class="form-select" id="courseId" name="courseId" required>
							<option value="">Select a course</option>
							<option th:each="course : ${courses}"
									th:selected="${grade.course != null and grade.course.id == course.id}"
									th:text="${course.courseCode + ' - ' + course.courseName}"
									th:value="${course.id}">CST-323</option>
						</select>
					</div>

					<div class="col-md-4">
						<label class="form-label" for="overallGrade">Overall Grade</label>
						<input class="form-control" id="overallGrade" max="100" min="0" step="0.01" th:classappend="${#fields.hasErrors('overallGrade')} ? 'is-invalid'" th:field="*{overallGrade}" type="number">
						<div class="invalid-feedback" th:errors="*{overallGrade}"></div>
					</div>

					<div class="col-md-4">
						<label class="form-label" for="letterGrade">Letter Grade</label>
						<input class="form-control" id="letterGrade" maxlength="2" th:classappend="${#fields.hasErrors('letterGrade')} ? 'is-invalid'" th:field="*{letterGrade}" type="text">
						<div class="invalid-feedback" th:errors="*{letterGrade}"></div>
					</div>

					<div class="col-md-12">
						<label class="form-label" for="comments">Comments</label>
						<input class="form-control" id="comments" th:classappend="${#fields.hasErrors('comments')} ? 'is-invalid'" th:field="*{comments}" type="text">
						<div class="invalid-feedback" th:errors="*{comments}"></div>
					</div>
				</div>
			</div>

			<div class="card-footer d-flex justify-content-end gap-2">
				<a class="btn btn-outline-secondary" th:href="@{/grades}">Cancel</a>
				<button class="btn btn-primary" type="submit">Save Grade</button>
			</div>
		</form>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
