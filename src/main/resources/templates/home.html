<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Course Log</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Course Log</a>
			<div class="navbar-nav">
				<a class="nav-link" th:href="@{/students}">Students</a>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div class="mb-4">
			<h1 class="h3 mb-1">Course Tracker</h1>
			<p class="text-muted mb-0">Select a database table to view.</p>
		</div>

		<div class="row g-3">
			<div class="col-md-6 col-lg-4">
				<div class="card shadow-sm h-100">
					<div class="card-body">
						<div class="d-flex justify-content-between align-items-start mb-3">
							<div>
								<h2 class="h5 mb-1">Student Database</h2>
								<p class="text-muted mb-0">View and manage student records.</p>
							</div>
							<span class="badge text-bg-primary" th:text="${studentCount}">0</span>
						</div>
						<a class="btn btn-primary" th:href="@{/students}">View Students</a>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
